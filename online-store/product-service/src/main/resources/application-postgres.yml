# Activated with --spring.profiles.active=postgres (see run-local.ps1). Overrides the H2 defaults.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/productdb
    username: store
    password: store
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update        # keep data between restarts (create-drop would wipe it)
    show-sql: true            # print every SQL statement - great for learning/debugging

logging:
  level:
    com.onlinestore: DEBUG    # our own code logs at debug level
